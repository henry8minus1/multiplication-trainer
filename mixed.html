<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Mixed Skills Trainer</title><link rel="stylesheet" href="trainer.css"></head><body data-mode="mixed"><div class="app"><nav class="nav"><a class="home" href="index.html">⌂ Home</a><a href="addition.html">Addition</a><a href="subtraction.html">Subtraction</a><a href="multiplication.html">Multiplication</a><a href="division.html">Division</a><a href="mixed.html">Mixed</a></nav><div class="top"><div><div class="brand" id="brand"></div><div class="sub">Choose any combination of skills and build mastery over 20-question sessions.</div></div><div class="stats"><div class="pill">🔥 <span id="streak">0</span></div><div class="pill">⭐ <span id="score">0</span></div></div></div><div class="setup"><div class="setup-box"><label for="student">Student</label><div class="student-row"><select id="student"></select><button type="button" class="icon-btn" id="add-student">＋</button></div></div><div class="setup-box"><div class="box-label">Skills and number families</div><div class="skill-picks" id="skill-picks"></div><div class="pick-grid" id="family-picks"></div><div class="note" id="family-note"></div></div><div class="setup-box"><label for="range">Fact range</label><select id="range"><option value="5">Learning · 0–5</option><option value="10">Growing · 0–10</option><option value="12">Mastery · 0–12</option></select><div class="note" id="range-note"></div></div></div><div class="progress"><div class="bar" id="bar"></div></div><section class="card" id="play"><div class="mode" id="mode"></div><div class="question" id="question"></div><div class="answer-grid" id="answers"></div><form class="type-wrap" id="type-form"><input class="type-input" id="type-input" type="number" inputmode="numeric" min="0" max="144"><button class="submit" type="submit">Check answer</button></form><div class="feedback" id="feedback"></div><div class="explain" id="explain"></div><div class="controls"><button type="button" class="small" id="hint">Show a hint</button><button type="button" class="small" id="restart">Restart session</button></div></section><section class="finish" id="finish"><h2>Nice work! 🎉</h2><p id="finish-text"></p><button type="button" class="small primary" id="again">Practice again</button></section><section class="mastery"><div class="section-title" id="mastery-title"></div><div class="summary" id="mastery-summary"></div><div class="facts" id="facts"></div></section><section class="history"><div class="section-title">Progress history</div><div class="summary" id="overall-summary"></div><div class="history-list" id="history-list"></div></section></div><script src="autosave.js"></script><script src="trainer.js"></script></body></html>
